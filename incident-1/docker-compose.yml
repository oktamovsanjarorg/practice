version: '3.8'

services:
  gateway:
    image: nginx:alpine
    container_name: incident1_gateway
    ports:
      - "8088:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

  backend:
    build: .
    container_name: incident1_backend
    restart: always
